<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login - NetBanking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header Bar */
        .header {
            background: linear-gradient(90deg, #003366 0%, #002244 100%);
            color: #ffffff;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .header .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .header .logo span {
            color: #F37021; /* ICICI Orange */
            margin-left: 5px;
        }

        .header .tagline {
            font-size: 13px;
            color: #cccccc;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Login Card */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border-top: 5px solid #003366; /* Administrative Navy Accent */
        }

        .card-header {
            background-color: #fafafa;
            padding: 20px 25px;
            border-bottom: 1px solid #eeeeee;
            text-align: center;
        }

        .card-header h2 {
            font-size: 20px;
            color: #003366;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .card-header .admin-badge {
            background-color: #003366;
            color: #ffffff;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-body {
            padding: 30px 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #444;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: #003366;
            box-shadow: 0 0 5px rgba(0, 51, 102, 0.2);
        }

        /* Primary Action Button - Administrative Navy */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #003366;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 5px;
        }

        .btn-submit:hover {
            background-color: #002244;
        }

        /* Admin Warning Notice */
        .admin-warning {
            margin-top: 20px;
            padding: 12px;
            background-color: #fff8e6;
            border: 1px solid #ffe58f;
            border-radius: 4px;
            font-size: 12px;
            color: #8a6d3b;
            text-align: center;
            line-height: 1.4;
        }

        /* Navigation Links */
        .links-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eeeeee;
            display: flex;
            justify-content: center;
            font-size: 13px;
        }

        .links-container a {
            color: #003366;
            text-decoration: none;
            font-weight: 600;
        }

        .links-container a:hover {
            color: #F37021;
            text-decoration: underline;
        }

        /* Footer */
        .footer {
            background-color: #eef2f5;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #666666;
            border-top: 1px solid #dddddd;
        }
    </style>
</head>
<body>

<!-- Header Bar -->
<div class="header">
    <div class="logo">BANKING<span>APP</span></div>
    <div class="tagline">Safe & Secure Administrative Console</div>
</div>

<!-- Main Content -->
<div class="main-container">
    <div class="login-card">
        <div class="card-header">
            <h2>Admin Login <span class="admin-badge">Secure</span></h2>
        </div>
        <div class="card-body">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Administrator ID</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter Admin ID" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter Password" required>
                </div>
                <button type="submit" class="btn-submit">Authenticate</button>
            </form>

            <div class="admin-warning">
                <strong>⚠️ Restricted Access:</strong> Unlawful access attempts are logged and monitored.
            </div>

            <!-- Nav Links -->
            <div class="links-container">
                <a href="/login">Back to Main Portal</a>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    &copy; Banking Application. All Rights Reserved.
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (!res.ok) {
                alert('Invalid administrative credentials.');
                return;
            }

            const data = await res.json();
            localStorage.setItem('token', data.token);
            localStorage.setItem('role', data.role);
            window.location.href = '/admin-dashboard';
        } catch (err) {
            alert('Server connectivity issue. Please try again.');
        }
    });
</script>
</body>
</html>
