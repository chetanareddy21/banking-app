<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Banking App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header Bar */
        .header {
            background: linear-gradient(90deg, #003366 0%, #002244 100%);
            color: #ffffff;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .header .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }

        .header .logo span {
            color: #F37021; /* ICICI Orange */
            margin-left: 5px;
        }

        .header .tagline {
            font-size: 13px;
            color: #cccccc;
        }

        /* Main Container */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Login Card */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border-top: 5px solid #F37021;
        }

        .card-header {
            background-color: #fafafa;
            padding: 20px 25px;
            border-bottom: 1px solid #eeeeee;
            text-align: center;
        }

        .card-header h2 {
            font-size: 20px;
            color: #003366;
            font-weight: 700;
        }

        .card-body {
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* User Login Button - Primary Orange */
        .btn-user {
            background-color: #F37021;
            color: #ffffff;
        }

        .btn-user:hover {
            background-color: #d95e12;
            box-shadow: 0 2px 8px rgba(243, 112, 33, 0.4);
        }

        /* Admin Login Button - Secondary Blue */
        .btn-admin {
            background-color: #003366;
            color: #ffffff;
        }

        .btn-admin:hover {
            background-color: #002244;
            box-shadow: 0 2px 8px rgba(0, 51, 102, 0.4);
        }

        /* Safe Banking Security Note */
        .security-note {
            margin-top: 15px;
            padding: 12px;
            background-color: #fff9f5;
            border: 1px solid #ffe3d1;
            border-radius: 4px;
            font-size: 12px;
            color: #666666;
            text-align: center;
        }

        .security-note strong {
            color: #F37021;
        }

        /* Footer */
        .footer {
            background-color: #eef2f5;
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: #666666;
            border-top: 1px solid #dddddd;
        }
    </style>
</head>
<body>

<!-- Header Bar -->
<div class="header">
    <div class="logo">BANKING<span>APP</span></div>
    <div class="tagline">Safe & Secure Internet Banking</div>
</div>

<!-- Main Content -->
<div class="main-container">
    <div class="login-card">
        <div class="card-header">
            <h2>Welcome to NetBanking</h2>
        </div>
        <div class="card-body">
            <button class="btn btn-user" onclick="location.href='/user-login'">
                Login as User
            </button>
            <button class="btn btn-admin" onclick="location.href='/admin-login'">
                Login as Admin
            </button>

            <div class="security-note">
                <strong>🔒 Security Tip:</strong> Never share your Password, OTP, or PIN with anyone.
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    &copy; Banking Application. All Rights Reserved.
</div>

</body>
</html>
