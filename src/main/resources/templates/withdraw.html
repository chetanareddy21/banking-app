<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Withdraw</title></head>
<body>
<h2>Withdraw</h2>
<input type="text" id="accNo" placeholder="Account Number"><br>
<input type="number" id="amount" placeholder="Amount" step="0.01"><br>
<button onclick="withdraw()">OK</button>
<p id="result"></p>
<p><a href="/user-dashboard">Back</a></p>

<script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    function withdraw() {
        const accountNumber = document.getElementById('accNo').value;
        const amount = document.getElementById('amount').value;

        fetch('/api/account/withdraw', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ accountNumber, amount })
        })
            .then(res => res.ok ? res.json() : Promise.reject(res))
            .then(data => document.getElementById('result').innerText = `New balance: ${data.balance}`)
            .catch(() => document.getElementById('result').innerText = 'Withdrawal failed — check balance or account number');
    }
</script>
</body>
</html>
