version: '3.8'

services:
  banking-mysql:
    image: mysql:8.0
    container_name: banking-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: banking_db
    networks:
      - banking-net  # <--- MUST match

  app:
    build: .
    container_name: banking-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://banking-mysql:3306/banking_db?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    networks:
      - banking-net  # <--- MUST match
    depends_on:
      - banking-mysql

networks:
  banking-net:      # <--- Declare the bridge network
    driver: bridge